

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171016">
<title>Um lugar entre palavras</title>

<style>
:root {
  --bg: #171016;
  --panel: #241820;
  --rose: #d99aa9;
  --text: #f8edf0;
  --muted: #c3aeb7;
  --line: #503440;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: radial-gradient(ellipse at top, #422431 0%, transparent 58%), var(--bg);
  color: var(--text);
  font-family: Georgia, "Times New Roman", serif;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 48px 22px 30px;
}

.moon { font-size: 32px; }

h1 {
  font-size: clamp(30px, 8vw, 46px);
  font-weight: normal;
  margin: 12px 0;
  color: #f5d9e1;
}

.subtitle {
  color: var(--muted);
  font-size: 15px;
  line-height: 1.7;
  max-width: 340px;
  margin: auto;
}

main {
  width: min(100% - 32px, 680px);
  margin: 0 auto 60px;
}

#search {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #21171e;
  color: var(--text);
  font-size: 16px;
  margin: 10px 0 22px;
  outline: none;
}

.section-title {
  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--rose);
  margin: 10px 0 16px;
}

#letters {
  display: grid;
  gap: 12px;
}

.letter-card {
  width: 100%;
  text-align: left;
  padding: 19px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: linear-gradient(130deg, #2d1d27, #21171e);
  color: var(--text);
  cursor: pointer;
  font: inherit;
}

.letter-card:active { transform: scale(.985); }
.letter-card:hover { border-color: var(--rose); }

.letter-card strong {
  display: block;
  font-size: 18px;
  font-weight: normal;
  line-height: 1.4;
}

.letter-card span {
  display: block;
  color: var(--muted);
  font: 12px Arial, sans-serif;
  margin-top: 8px;
}

#reader {
  display: none;
  background: rgba(36, 24, 32, .96);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 23px 20px;
}

#reader h2 {
  color: #f3cbd7;
  font-size: 27px;
  line-height: 1.3;
  font-weight: normal;
}

#content {
  white-space: pre-wrap;
  font-size: 18px;
  line-height: 1.95;
  overflow-wrap: anywhere;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 25px;
}

.actions button, .back {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 15px;
  background: #392531;
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
}

.back { margin-bottom: 10px; }

footer {
  text-align: center;
  color: #a9909b;
  font-size: 13px;
  padding: 15px 24px 40px;
  line-height: 1.8;
}

.empty {
  color: var(--muted);
  line-height: 1.7;
  text-align: center;
  padding: 20px 5px;
}
</style>
</head>
<body>

<header>
  <div class="moon">☾ ✦</div>
  <h1>Um lugar entre palavras</h1>
  <p class="subtitle">
    Algumas coisas são difíceis de dizer olhando nos olhos.
    Então deixei que as palavras encontrassem seu caminho até você.
  </p>
</header>

<main>
  <section id="library">
    <p class="section-title">Cartas para você</p>
    <input id="search" type="search" placeholder="Procurar uma carta..." aria-label="Procurar uma carta">
    <div id="letters"></div>
  </section>

  <section id="reader">
    <button class="back" id="back">← Todas as cartas</button>
    <h2 id="title"></h2>
    <div id="content"></div>
    <div class="actions">
      <button id="previous">← Anterior</button>
      <button id="next">Próxima →</button>
    </div>
  </section>
</main>

<footer>
  Feito de palavras, lembranças e sentimentos. ♡<br>
  Um pequeno lugar no mundo que existe só entre as linhas.
</footer>
