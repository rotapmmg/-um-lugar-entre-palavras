

<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nossa Biblioteca 🌙</title>

  <style>

    :root {

      --bg: #080d20;

      --panel: #111a35;

      --panel2: #172344;

      --text: #f5f3ff;

      --muted: #b8c2df;

      --accent: #a9b8ff;

      --line: #344365;

      --danger: #ff9baf;

    }

    * { box-sizing: border-box; }

    body {

      margin: 0;

      min-height: 100vh;

      color: var(--text);

      font-family: Georgia, "Times New Roman", serif;

      background:

        radial-gradient(ellipse at 15% 10%, rgba(78,83,159,.3), transparent 42%),

        radial-gradient(ellipse at 90% 75%, rgba(38,112,155,.2), transparent 42%),

        var(--bg);

    }

    button, input, textarea { font: inherit; }

    button {

      cursor: pointer;

      border: 1px solid var(--line);

      border-radius: 12px;

      padding: 12px 15px;

      color: var(--text);

      background: var(--panel2);

    }

    button:hover { filter: brightness(1.15); }

    .primary {

      width: 100%;

      color: #10172f;

      font-weight: bold;

      background: var(--accent);

      border: 0;

    }

    .danger { color: var(--danger); }

    .wrap {

      width: min(760px, 100%);

      margin: auto;

      padding: 22px 16px 45px;

    }

    header {

      text-align: center;

      padding: 22px 8px 28px;

    }

    .moon {

      font-size: 48px;

      margin-bottom: 8px;

      filter: drop-shadow(0 0 18px #b9c5ff);

    }

    h1 {

      font-size: clamp(27px, 7vw, 40px);

      font-weight: normal;

      margin: 5px 0 10px;

    }

    .subtitle { color: var(--muted); line-height: 1.6; }

    .panel {

      background: rgba(17,26,53,.92);

      border: 1px solid var(--line);

      border-radius: 20px;

      padding: 22px;

      margin-bottom: 18px;

      box-shadow: 0 12px 35px rgba(0,0,0,.15);

    }

    .hidden { display: none !important; }

    label {

      display: block;

      color: var(--muted);

      margin: 14px 0 7px;

    }

    input, textarea {

      width: 100%;

      border: 1px solid var(--line);

      background: #0a1229;

      color: var(--text);

      border-radius: 12px;

      padding: 13px;

      margin-top: 7px;

    }

    textarea {

      min-height: 230px;

      resize: vertical;

      line-height: 1.75;

    }

    .stack { display: grid; gap: 12px; }

    .space-button {

      width: 100%;

      text-align: left;

      padding: 20px;

      font-size: 18px;

    }

    .space-button small {

      display: block;

      margin-top: 7px;

      color: var(--muted);

      font-size: 13px;

    }

    .top-actions {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 18px;

    }

    .top-actions button { flex: 1; }

    .letter-card {

      padding: 17px;

      border: 1px solid var(--line);

      border-radius: 15px;

      background: var(--panel2);

      margin: 12px 0;

    }

    .letter-card h3 { margin: 0 0 8px; }

    .letter-card p {

      color: var(--muted);

      line-height: 1.5;

      white-space: pre-wrap;

      overflow-wrap: anywhere;

    }

    .letter-actions {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 12px;

    }

    .letter-actions button { flex: 1; }

    .letter-content {

      line-height: 1.9;

      white-space: pre-wrap;

      overflow-wrap: anywhere;

      font-size: 17px;

    }

    .status {

      color: var(--muted);

      font-size: 14px;

      line-height: 1.5;

      margin-top: 12px;

    }

    .error { color: var(--danger); }

    .section-title { margin-top: 0; }

    footer {

      text-align: center;

      color: var(--muted);

      padding: 16px 0;

      font-size: 13px;

    }

  </style>

</head>

<body>

  <div class="wrap">

    <header>

      <div class="moon">🌙</div>

      <h1>Nossa Biblioteca</h1>

      <div class="subtitle">Um lugar entre palavras, lembranças e sentimentos.</div>

    </header>

    <!-- LOGIN -->

    <section id="loginScreen" class="panel">

      <h2 class="section-title">Entre na nossa biblioteca</h2>

      <p class="subtitle">Um cantinho reservado para nossas cartas.</p>

      <form id="loginForm">

        <label for="email">E-mail</label>

        <input id="email" type="email" autocomplete="username" required>

        <label for="password">Senha</label>

        <input id="password" type="password"

               autocomplete="current-password" required>

        <button class="primary" type="submit">Entrar 🌙</button>

      </form>

      <p id="loginStatus" class="status" role="status"></p>

    </section>

    <!-- ESCOLHA DOS ESPAÇOS -->

    <section id="spaceChooser" class="panel hidden">

      <h2 class="section-title">Escolha um cantinho</h2>

      <p class="subtitle">Cada palavra tem seu lugar por aqui.</p>

      <div class="stack">

        <button class="space-button" data-space="mel">

          🌷 Cartas da Mel

          <small>Textos, cartas e pensamentos da Mel.</small>

        </button>

        <button class="space-button" data-space="brenda">

          🌙 Cartas da Brenda

          <small>Textos, cartas e pensamentos da Brenda.</small>

        </button>

      </div>

      <p id="spaceStatus" class="status" role="status"></p>

      <button id="logoutFromSpaces" style="margin-top:14px;width:100%">

        Sair da conta

      </button>

    </section>

    <!-- LISTA DE CARTAS -->

    <section id="libraryScreen" class="panel hidden">

      <div class="top-actions">

        <button id="backToSpaces">← Voltar aos cantinhos</button>

        <button id="newLetter">＋ Adicionar carta</button>

      </div>

      <h2 id="libraryTitle" class="section-title">Cartas</h2>

      <p class="subtitle">Cada carta guarda um pedacinho de nós.</p>

      <div id="letterList"></div>

      <p id="libraryStatus" class="status" role="status"></p>

    </section>

    <!-- LEITURA -->

    <section id="readerScreen" class="panel hidden">

      <div class="top-actions">

        <button id="backToLibrary">← Todas as cartas</button>

        <button id="readerBackSpaces">← Cantinhos</button>

      </div>

      <h2 id="readerTitle"></h2>

      <div id="readerContent" class="letter-content"></div>

      <p id="readerStatus" class="status" role="status"></p>

    </section>

    <!-- EDITOR -->

    <section id="editorScreen" class="panel hidden">

      <div class="top-actions">

        <button id="backFromEditor">← Voltar</button>

      </div>

      <h2 id="editorHeading">Nova carta</h2>

      <form id="letterForm">

        <label for="letterTitle">Título da carta</label>

        <input id="letterTitle" maxlength="180" required

               placeholder="Dê um nome para essa lembrança">

        <label for="letterContent">Sua carta</label>

        <textarea id="letterContent" required

                  placeholder="Escreva aqui tudo o que quiser guardar..."></textarea>

        <button id="saveLetter" class="primary" type="submit">

          Salvar carta

        </button>

      </form>

      <p id="editorStatus" class="status" role="status"></p>

    </section>

    <footer>Feito de palavras, cuidado e luar. ✨</footer>

  </div>

  <script type="module">

    import { initializeApp } from

      "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

    import {

      getAuth,

      onAuthStateChanged,

      signInWithEmailAndPassword,

      signOut

    } from

      "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    import {

      getFirestore,

      collection,

      addDoc,

      getDocs,

      doc,

      updateDoc,

      deleteDoc,

      query,

      where,

      serverTimestamp

    } from

      "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const firebaseConfig = {

      apiKey: "AIzaSyD7u4x9h3K2m8v5n1q0p6r4t9w2x7y8z",

      authDomain: "nossa-biblioteca-c9513.firebaseapp.com",

      projectId: "nossa-biblioteca-c9513",

      storageBucket: "nossa-biblioteca-c9513.firebasestorage.app",

      messagingSenderId: "000000000000",

      appId: "1:000000000000:web:0000000000000000000000"

    };

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);

    const screens = [

      "loginScreen",

      "spaceChooser",

      "libraryScreen",

      "readerScreen",

      "editorScreen"

    ];

    let currentUser = null;

    let currentSpace = null;

    let currentLetters = [];

    let editingId = null;

    let openedLetter = null;

    let editorReturnScreen = "libraryScreen";

    function showScreen(id) {

      screens.forEach(screenId => $(screenId).classList.add("hidden"));

      $(id).classList.remove("hidden");

      window.scrollTo({ top: 0, behavior: "smooth" });

    }

    function setStatus(id, message, isError = false) {

      $(id).textContent = message;

      $(id).classList.toggle("error", isError);

    }

    function spaceName(space) {

      return space === "mel" ? "Cartas da Mel" : "Cartas da Brenda";

    }

    function escapeHTML(value = "") {

      return String(value).replace(/[&<>"']/g, char => ({

        "&": "&amp;",

        "<": "&lt;",

        ">": "&gt;",

        '"': "&quot;",

        "'": "&#39;"

      })[char]);

    }

    $("loginForm").addEventListener("submit", async (event) => {

      event.preventDefault();

      setStatus("loginStatus", "Entrando...");

      try {

        await signInWithEmailAndPassword(

          auth,

          $("email").value.trim(),

          $("password").value

        );

      } catch (error) {

        setStatus(

          "loginStatus",

          "Não consegui entrar. Confira o e-mail e a senha. (" +

            error.code + ")",

          true

        );

      }

    });

    onAuthStateChanged(auth, user => {

      currentUser = user;

      if (user) {

        setStatus("loginStatus", "");

        showScreen("spaceChooser");

      } else {

        currentSpace = null;

        currentLetters = [];

        editingId = null;

        openedLetter = null;

        showScreen("loginScreen");

      }

    });

    document.querySelectorAll("[data-space]").forEach(button => {

      button.addEventListener("click", async () => {

        currentSpace = button.dataset.space;

        await loadLetters();

      });

    });

    async function loadLetters() {

      if (!currentUser || !currentSpace) return;

      showScreen("libraryScreen");

      $("libraryTitle").textContent = spaceName(currentSpace);

      $("letterList").innerHTML = "";

      setStatus("libraryStatus", "Carregando suas cartas...");

      try {

        const lettersQuery = query(

          collection(db, "letters"),

          where("space", "==", currentSpace)

        );

        const snapshot = await getDocs(lettersQuery);

        currentLetters = snapshot.docs.map(item => ({

          id: item.id,

          ...item.data()

        }));

        currentLetters.sort((a, b) => {

          const aTime = a.createdAt?.seconds || 0;

          const bTime = b.createdAt?.seconds || 0;

          return bTime - aTime;

        });

        renderLetters();

      } catch (error) {

        setStatus(

          "libraryStatus",

          "Não foi possível carregar as cartas. Confira as regras do Firestore. (" +

            error.code + ")",

          true

        );

      }

    }

    function renderLetters() {

      const list = $("letterList");

      list.innerHTML = "";

      if (!currentLetters.length) {

        list.innerHTML =

          '<p class="subtitle">Ainda não há cartas neste cantinho. Que tal escrever a primeira? ✨</p>';

        setStatus("libraryStatus", "");

        return;

      }

      currentLetters.forEach(letter => {

        const card = document.createElement("article");

        card.className = "letter-card";

        const title = document.createElement("h3");

        title.textContent = letter.title || "Carta sem título";

        const preview = document.createElement("p");

        preview.textContent = (letter.content || "").slice(0, 160) +

          ((letter.content || "").length > 160 ? "..." : "");

        const actions = document.createElement("div");

        actions.className = "letter-actions";

        const readButton = document.createElement("button");

        readButton.textContent = "Ler carta";

        readButton.addEventListener("click", () => openLetter(letter.id));

        const editButton = document.createElement("button");

        editButton.textContent = "Editar";

        editButton.addEventListener("click", () => startEditing(letter.id));

        const deleteButton = document.createElement("button");

        deleteButton.textContent = "Excluir";

        deleteButton.className = "danger";

        deleteButton.addEventListener("click", () => removeLetter(letter.id));

        actions.append(readButton, editButton, deleteButton);

        card.append(title, preview, actions);

        list.appendChild(card);

      });

      setStatus("libraryStatus", `${currentLetters.length} carta(s) neste cantinho.`);

    }

    function openLetter(id) {

      openedLetter = currentLetters.find(letter => letter.id === id);

      if (!openedLetter) return;

      $("readerTitle").textContent = openedLetter.title || "Carta sem título";

      $("readerContent").textContent = openedLetter.content || "";

      setStatus("readerStatus", "");

      showScreen("readerScreen");

    }

    $("backToLibrary").addEventListener("click", () => {

      showScreen("libraryScreen");

    });

    $("readerBackSpaces").addEventListener("click", () => {

      showScreen("spaceChooser");

    });

    $("backToSpaces").addEventListener("click", () => {

      showScreen("spaceChooser");

    });

    $("newLetter").addEventListener("click", () => {

      editingId = null;

      editorReturnScreen = "libraryScreen";

      $("editorHeading").textContent = "Escrever uma nova carta";

      $("letterForm").reset();

      setStatus("editorStatus", "");

      showScreen("editorScreen");

    });

    function startEditing(id) {

      const letter = currentLetters.find(item => item.id === id);

      if (!letter) return;

      editingId = id;

      editorReturnScreen = "readerScreen";

      openedLetter = letter;

      $("editorHeading").textContent = "Editar carta";

      $("letterTitle").value = letter.title || "";

      $("letterContent").value = letter.content || "";

      setStatus("editorStatus", "");

      showScreen("editorScreen");

    }

    $("backFromEditor").addEventListener("click", () => {

      showScreen(editorReturnScreen);

    });

    $("letterForm").addEventListener("submit", async (event) => {

      event.preventDefault();

      if (!currentUser || !currentSpace) return;

      const title = $("letterTitle").value.trim();

      const content = $("letterContent").value.trim();

      if (!title || !content) {

        setStatus("editorStatus", "Preencha o título e o conteúdo.", true);

        return;

      }

      $("saveLetter").disabled = true;

      setStatus("editorStatus", "Salvando sua carta...");

      try {

        if (editingId) {

          await updateDoc(doc(db, "letters", editingId), {

            title,

            content,

            updatedAt: serverTimestamp()

          });

        } else {

          await addDoc(collection(db, "letters"), {

            title,

            content,

            space: currentSpace,

            owner: currentSpace,

            createdBy: currentUser.uid,

            createdAt: serverTimestamp()

          });

        }

        editingId = null;

        await loadLetters();

      } catch (error) {

        setStatus(

          "editorStatus",

          "Não foi possível salvar. Confira as regras do Firestore. (" +

            error.code + ")",

          true

        );

      } finally {

        $("saveLetter").disabled = false;

      }

    });

    async function removeLetter(id) {

      const letter = currentLetters.find(item => item.id === id);

      if (!letter) return;

      const confirmed = confirm(

        `Deseja excluir a carta "${letter.title || "sem título"}"? Essa ação não pode ser desfeita.`

      );

      if (!confirmed) return;

      try {

        await deleteDoc(doc(db, "letters", id));

        await loadLetters();

      } catch (error) {

        setStatus(

          "libraryStatus",

          "Não foi possível excluir. Confira as regras do Firestore. (" +

            error.code + ")",

          true

        );

      }

    }

    $("logoutFromSpaces").addEventListener("click", async () => {

      await signOut(auth);

    });

  </script>

</body>

</html>
